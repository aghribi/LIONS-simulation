    title: HOT TARGET
    client: "RADIOACTIVE BEAMS: 70 MeV protons on a production target. Up to 1.4 kW, spread out, for 40 kJ. Melt it and the campaign is over."
    brief: "Power is what makes the isotopes. Too much melts the target; too small a spot makes a hot spot; too large a spot misses it."
    lesson: "A target limits the beam as much as the machine does. A small focus is not always the goal."
    switches: {noise: illustrative, drift: illustrative, errors: illustrative, density_limit: illustrative}
