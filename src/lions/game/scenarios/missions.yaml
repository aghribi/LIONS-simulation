    brief: "The field sets the energy, the RF must follow, and it can lock on harmonic 2 or 3. Close the energy slit until the spread fits, but keep the current."
    lesson: "E/A = K (Q/A)^2 sets what a machine can reach. Harmonic, field and frequency are one system."
    switches: {noise: illustrative, drift: illustrative, errors: illustrative}
    ion: {name: Ne-20 4+, mass_number: 20, charge: 4}
    harmonic: 3
