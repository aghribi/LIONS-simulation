# Missions. Every machine is a training machine, built to be consistent with the formulas, not a copy of a real one.
# SOURCED, used as given:
# - Proton range and straggling in water: Bortfeld, Med. Phys. 24, 2024 (1997), in lions.game.physics.
# - Eye tumours are treated at about 70 MeV, ranges up to 35 mm: HZB and IBA facility descriptions.
# - 18O(p,n)18F saturation yield 7.8 to 8.5 GBq/uA at 18 MeV: Niroomand-Rad 2003; Silva et al. (IBA 18 MeV).
# - K = 265, 1.5 m, 0.75 to 1.56 T, harmonics 2 to 5: GANIL CIME papers. Its RF range here is derived from these, not quoted.
# - Target power 1.4 kW: the first SPIRAL limit, GANIL papers.
# - Space tests: flux 1e5 to 1e9 p/cm2/s and field uniformity +-10%: LANL lecture, USPAS 2019, and the ESCC 22900 excerpt (truncated, so the
#   reading of its 10% is not confirmed). Fluence and the sample energy here are choices, not quoted requirements.
# UNVERIFIED, from memory: half-life of 18F 109.8 min; threshold of 18O(p,n) 2.6 MeV.
# ILLUSTRATIVE, no source: noise, drift, hidden errors, heat rate, space charge, limits on lost beam, spot and density limits, and the
# linear yield against energy. Each score records them in its switches.
scenario: missions
stages:
  - stage: therapy
    id: EYE
    title: EYE TUMOUR
    client: "HOSPITAL: melanoma at 28 mm in a water phantom. Bragg peak on the tumour, 60 Gy, not more. Degrade the 230 MeV beam."
    brief: "Put the Bragg peak on the tumour with the degrader, steer onto the axis, then hold SPACE and release at the prescription."
    lesson: "A cyclotron gives one energy. The degrader sets the depth, and pays for it in scattering and lost protons."
    switches: {noise: illustrative, drift: illustrative, errors: illustrative}
    ion: {name: p, mass_number: 1, charge: 1}
    harmonic: 4
    machine: &m230
      radius: {value: 1.05, unit: m}
      sectors: {value: 4, unit: "1"}
      flutter: {value: 0.12, unit: "1"}
      spiral_deg: {value: 60.0, unit: deg}
      dees: {value: 2, unit: "1"}
      dee_angle_deg: {value: 36.0, unit: deg}
      w_injection: {value: 0.05, unit: MeV/u}
      z_injection: {value: 3.0, unit: mm}
      z_aperture: {value: 15.0, unit: mm}
      deflector_scale: {value: 0.2, unit: kV/MV}
      r_size: {value: 0.3, unit: mm}
      septum: {value: 0.1, unit: mm}
      deflector_gain: {value: 300.0, unit: mm}
      spot_base: {value: 3.0, unit: mm}
      spot_quad_width: {value: 0.1, unit: "1"}
      drift: {value: 0.15, unit: m}
      theta_accept: {value: 0.02, unit: rad}
      space_charge: {value: 0.002, unit: 1/uA}
      max_lost_kw: {value: 0.5, unit: kW}
    knobs:
      - {key: degrader_cm, label: DEGRADER, unit: cm, min: 0.0, max: 34.0, rate: 2.0, start_error: 8.0}
      - {key: rf_mhz, label: RF, unit: MHz, min: 104.0, max: 112.0, rate: 0.02, start_error: 0.05}
      - {key: b0, label: FIELD, unit: T, min: 1.6, max: 2.0, rate: 0.002, start_error: 0.002}
      - {key: phase_deg, label: PHASE, unit: deg, min: -90.0, max: 90.0, rate: 20.0, start_error: 25.0}
      - {key: deflector_kv, label: DEFLECTOR, unit: kV, min: 40.0, max: 120.0, rate: 2.0, start_error: 4.0}
      - {key: steer_x, label: STEER X, unit: mm, min: -30.0, max: 30.0, rate: 8.0, start_error: 6.0}
      - {key: steer_y, label: STEER Y, unit: mm, min: -30.0, max: 30.0, rate: 8.0, start_error: 6.0}
    params:
      w_target: {value: 230.0, unit: MeV}
      dee_kv: {value: 100.0, unit: kV}
      source_ua: {value: 0.003, unit: uA}
      time_limit: {value: 120.0, unit: s}
      noise: {value: 0.005, unit: "1"}
      drift: {value: 0.00001, unit: 1/s^0.5}
      field_error: {value: 0.0005, unit: "1"}
      steer_error: {value: 5.0, unit: mm}
      quad_error: {value: 0.02, unit: "1"}
      phase_error: {value: 15.0, unit: deg}
      heat_rate: {value: 0.2, unit: 1/s}
      depth_cm: {value: 2.8, unit: cm}
      half_width_cm: {value: 0.4, unit: cm}
      lateral_mm: {value: 3.0, unit: mm}
      dose_gy: {value: 60.0, unit: Gy}
      dose_tolerance: {value: 0.05, unit: "1"}
      healthy_limit_gy: {value: 6.0, unit: Gy}
      field_area_cm2: {value: 3.0, unit: cm2}
