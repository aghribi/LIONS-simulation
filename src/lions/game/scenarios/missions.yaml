  - stage: qualification
    id: QUAL
    title: MATERIAL QUALIFICATION
    client: "QUALIFICATION LAB: a material sample for a satellite, 20 mm wide. 60 MeV protons, flux 1e7 to 1e8 per cm2 per s, 80% edge over centre, 1e10 per cm2."
    brief: "Degrade to 60 MeV. Open the spot with the quadrupole until the edge of the sample gets its share, while the flux stays in the window. Dose out of spec spoils the test."
    lesson: "A test beam is wide and weak on purpose. Fluence, flux and uniformity decide what a qualification result is worth: the beam line is the test bench."
    switches: {noise: illustrative, drift: illustrative, errors: illustrative, fluence: illustrative}
    ion: {name: p, mass_number: 1, charge: 1}
