      field_error: {value: 0.0005, unit: "1"}
      steer_error: {value: 5.0, unit: mm}
      quad_error: {value: 0.02, unit: "1"}
      phase_error: {value: 15.0, unit: deg}
      heat_rate: {value: 0.2, unit: 1/s}
      depth_cm: {value: 15.0, unit: cm}
      half_width_cm: {value: 0.8, unit: cm}
