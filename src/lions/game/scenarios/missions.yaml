  - stage: isotope
    id: F18
    title: FLUORINE-18
    client: "RADIOPHARMACY: 120 GBq of F-18 for the morning PET list, by end of shift. It decays while it waits."
    brief: "18 MeV protons on enriched water. More current, more activity, but the water must not boil and lost beam activates the machine."
    lesson: "Activity saturates: A = Y I (1 - exp(-lambda t)). Extraction efficiency is what lets you run high current."
