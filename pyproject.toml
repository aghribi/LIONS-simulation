[project]
name = "lions"
version = "2.0.0"
description = "Ion tracking in separated-sector cyclotrons (Python port of LIONS, P. Bertrand, GANIL)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
    "PyQt5>=5.15",
    "matplotlib>=3.5",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
gl = ["PyOpenGL>=3.1", "PyQtWebEngine>=5.15", "plotly>=5"]
game = [
    "cma>=4.5.0",
    "pyarrow>=25.0.1",
    "pymoo>=0.6.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
]
rl = [
    "gymnasium>=1.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "stable-baselines3>=2.9",
]
bo = [
    "botorch>=0.15",
]

[dependency-groups]
bench = [
    "h5py>=3.12",
    "pyarrow>=25.0.1",
    "rf-track>=2.7.4",
    "scipy>=1.13",
]
dev = [
    "pytest>=9.2.0",
]
docs = [
    "sphinx>=7",
    "myst-parser>=3",
    "furo>=2024.1.29",
]
gpu = [
    "pyarrow>=25.0.1",
    "torch>=2.15.0 ; python_full_version >= '3.11'",
]

[project.scripts]
lions = "lions.cli:main"
lions-gui = "lions.gui.app:main"
lions-arcade = "lions.game.arcade:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.ruff]
line-length = 79
extend-exclude = ["benchmarks/external", "benchmarks/runs"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "W", "F", "N", "D1"]
# D105, D107: dunders and __init__ are covered by the class docstring.
ignore = ["D105", "D107"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1"]
